apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: production-service-rollout
spec:
  replicas: 2
  strategy:
    blueGreen:
      activeService: prod-active-svc
      previewService: prod-preview-svc
      autoPromotionEnabled: false
  template:
    metadata:
      labels:
        app: prod-app
    spec:
      containers:
      - name: web-app
        image: nginx:alpine
        ports:
        - containerPort: 80
